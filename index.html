<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写真表示</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    .photo-container {
      margin-top: 20px;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>写真詳細</h1>

  <div class="photo-container">
    <!-- 写真を表示するimgタグ（IDを付与） -->
    <img id="photo" src="" alt="写真">
  </div>

  <script>
    // 1. URLのパラメーター(?id=xxx)を取得
    const urlParams = new URLSearchParams(window.location.search);
    
    // 2. idパラメータを取得。指定がない場合はデフォルトで '001' を使う
    const photoId = urlParams.get('id') || '001';

    // 3. images フォルダ内の画像を読み込むパスを作成
    // ※ 拡張子が .JPG（大文字）の場合は '.JPG' に変更してください
    const imagePath = `images/${photoId}.jpg`;

    // 4. <img> タグの src にパスをセットして表示
    const imgElement = document.getElementById('photo');
    if (imgElement) {
      imgElement.src = imagePath;
    }
  </script>

</body>
</html>
